<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="icon" type="image/png" href="icon.png">
</head>

<body>
    <h1>Expense Tracker</h1>

    <p>Enter an expense below:</p>

    <input type="text" id="expense-name" placeholder="Expense name">

    <input type="number" id="expense-amount" placeholder="Amount">
    <input type="number" id="expense-quantity" placeholder="Quantity">
    <button type="button" id="add-button">Add expense</button>
    <p>Total: Rs. <span id="total">0</span></p>
    <p>Expense Count: <span id="count">0</span> </p>
    <h2>Expenses</h2>

    <ul id="expense-list"></ul>
    <video class="background-video" autoplay muted loop playsinline>
        <source src="https://www.pexels.com/download/video/3194277/" type="video/mp4">
    </video>

</body>
</html>
